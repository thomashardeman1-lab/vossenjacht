<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testopstelling • De Digitale Vossenjacht</title>
  <style>
    html, body { margin: 0; height: 100%; background: #d9ccad; font-family: system-ui, sans-serif; color: #5e4c3a; }
    .rij { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: calc(100% - 40px); padding: 0 12px 12px; box-sizing: border-box; }
    iframe { width: 100%; height: 100%; border: 1px solid #5e4c3a; border-radius: 6px; background: #ece2cb; }
    p { margin: 0; padding: 12px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <p>Testopstelling: beide iPads naast elkaar op één scherm. Links de Vos, rechts de Jager.</p>
  <div class="rij">
    <iframe src="index.html?rol=vos" title="Scherm van de Vos"></iframe>
    <iframe src="index.html?rol=jager" title="Scherm van de Jager"></iframe>
  </div>
</body>
</html>
